name: Lockfile Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - apps/web/package.json
      - packages/*/package.json
      - package-lock.json
      - .github/workflows/lockfile-check.yml

permissions:
  contents: read

jobs:
  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Generate package-lock.json for verification
        run: npm install --package-lock-only --no-audit

      - name: Verify clean lockfile install
        run: npm ci --no-audit

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Upload generated lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
