name: PhiOffice369 CI

on:
  pull_request:
    branches: [main, 'feat/readiness-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies from lockfile
        run: npm ci --no-audit

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Smoke-check GitHub Pages output
        run: npm run smoke:pages

      - name: Verify Chrome availability
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Run production browser acceptance
        run: npm run test:browser

      - name: Test PhiOS workspace bridge across browser origins
        run: npm run test:browser:bridge
